name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check image_processing tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install CPU-only PyTorch (required by sahi at import time)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with test dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
